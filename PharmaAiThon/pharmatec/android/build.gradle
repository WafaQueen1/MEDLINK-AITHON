allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { project ->
    project.plugins.withId("com.android.library") {
        def androidExtension = project.extensions.findByName("android")
        if (androidExtension != null && androidExtension.hasProperty("namespace") && androidExtension.namespace == null) {
            def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def manifest = new XmlSlurper().parse(manifestFile)
                def packageName = manifest.@package.text()
                if (packageName) {
                    androidExtension.namespace = packageName
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            // Old WorkManager releases crash on Android 12+ because they create
            // PendingIntents without the required mutability flag.
            force "androidx.work:work-runtime:2.8.1"
            force "androidx.work:work-runtime-ktx:2.8.1"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
